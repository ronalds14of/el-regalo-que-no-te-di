<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="page-shell fade-in">
        <div class="topbar">
            <a class="back-link" href="menu.html">Volver al menú</a>
        </div>

        <h2>Videos</h2>

        <section class="videos-grid">
            <article class="video-card">
                <div class="thumb">▶</div>
                <div class="video-content">
                    <h3 class="video-title">Historias que nunca pude escribir</h3>
                    <p class="video-text">Hay cosas que no pude decir con palabras.<br>Por eso decidí contártelas con mi voz.<br>Cada vez que pulses el botón descubrirás una historia diferente.</p>
                    <a id="discover-video" class="btn video-btn" href="#">Ver una historia</a>
                </div>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        const videoLinks = [

            'https://drive.google.com/file/d/1JSuDyP4A950jkyLFvqR2Zm3mDgoXXLne/view?usp=sharing',
            'https://drive.google.com/file/d/1bsXM_jeXhZu7KCmZux8v3PY7HCuamWoE/view?usp=sharing'
        ];

        let lastVideoIndex = -1;
        const discoverVideo = document.getElementById('discover-video');

        discoverVideo.addEventListener('click', (event) => {
            event.preventDefault();
            if (!videoLinks.length) return;

            let nextIndex = Math.floor(Math.random() * videoLinks.length);
            if (videoLinks.length > 1) {
                while (nextIndex === lastVideoIndex) {
                    nextIndex = Math.floor(Math.random() * videoLinks.length);
                }
            }

            lastVideoIndex = nextIndex;
            window.open(videoLinks[nextIndex], '_blank');
        });
    </script>
</body>
</html>
