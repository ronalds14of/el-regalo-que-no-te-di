<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canciones</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .page-shell {
            width: min(95vw, 1100px);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .topbar {
            margin-bottom: 0.4rem;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.2rem;
            position: relative;
            z-index: 1;
        }

        .song-card {
            background: linear-gradient(135deg, rgba(239, 226, 200, 0.06), rgba(202, 168, 107, 0.05));
            border: 1px solid rgba(202, 168, 107, 0.24);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.24);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .song-card:hover {
            transform: translateY(-6px);
            border-color: rgba(202, 168, 107, 0.5);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.3);
        }

        .cover {
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, rgba(202, 168, 107, 0.28), rgba(239, 226, 200, 0.08));
            display: grid;
            place-items: center;
            font-size: 2.6rem;
            color: var(--gold);
        }

        .song-content {
            padding: 1.15rem 1.15rem 1.25rem;
        }

        .song-title {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .song-artist {
            color: var(--gold);
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .song-text {
            font-size: 0.96rem;
            line-height: 1.7;
            color: var(--text-soft);
            margin-bottom: 1rem;
        }

        .song-btn {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        @media (max-width: 700px) {
            .songs-grid {
                grid-template-columns: 1fr;
            }

            .page-shell {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell fade-in">
        <div class="topbar">
            <a class="back-link" href="menu.html">Volver al menú</a>
        </div>

        <h2>Canciones</h2>

        <section class="songs-grid" id="songs-grid"></section>
    </main>

    <script src="data/canciones.js"></script>
    <script src="script.js"></script>
    <script>
        const icons = ['🎼', '🎶', '🎵', '♪'];
        const grid = document.getElementById('songs-grid');

        if (typeof canciones !== 'undefined' && Array.isArray(canciones)) {
            canciones.forEach((song, index) => {
                const icon = icons[index % icons.length];
                const card = document.createElement('article');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="cover">${icon}</div>
                    <div class="song-content">
                        <h3 class="song-title">${song.titulo}</h3>
                        <p class="song-artist">${song.artista}</p>
                        <p class="song-text">${song.mensaje}</p>
                        <a class="btn song-btn" href="${song.link}" target="_blank">Escuchar</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
