        // Lógica: mostrar poemas en orden aleatorio sin repeticiones durante la sesión.
        const letterDate = document.getElementById('letter-date');
        const letterTitle = document.getElementById('letter-title');
        const letterText = document.getElementById('letter-text');
        const nextLetterButton = document.getElementById('next-letter');
        const letterCard = document.querySelector('.letter-card');
        const actions = document.querySelector('.actions');

        let remainingIndices = [];
        let shownCount = 0;

        function initPool() {
            remainingIndices = poemas.map((_, i) => i);
            shownCount = 0;
        }

        function showPoemByIndex(arrayIndex, sequenceNumber) {
            const poema = poemas[arrayIndex];
            letterCard.classList.remove('is-visible');
            // Mostrar el ID real del poema (no el orden de lectura)
            letterDate.textContent = `CARTA ${poema.id}`;
            letterTitle.textContent = poema.titulo;
            letterText.textContent = poema.texto;
            requestAnimationFrame(() => {
                letterCard.classList.add('is-visible');
            });
        }

        function showFinalMessage() {
            letterCard.classList.remove('is-visible');
            letterDate.textContent = '';
            letterTitle.textContent = 'Has llegado al final...';
            letterText.textContent = `Leíste todas las cartas que tenía para ti.\nGracias por dedicarme tu tiempo.\n\nSupongo que ahora me toca escribir más.\n\nQuizá algún día vuelvas y encuentres nuevas páginas esperando por ti. ❤️`;
            // ocultar botón siguiente y añadir botón de reinicio
            nextLetterButton.style.display = 'none';
            let restartBtn = document.getElementById('restart-button');
            if (!restartBtn) {
                restartBtn = document.createElement('button');
                restartBtn.id = 'restart-button';
                restartBtn.type = 'button';
                restartBtn.className = 'btn';
                restartBtn.textContent = 'Volver a empezar';
                actions.appendChild(restartBtn);
                restartBtn.addEventListener('click', () => {
                    // reiniciar recorrido y mostrar nuevo poema aleatorio
                    restartBtn.remove();
                    nextLetterButton.style.display = '';
                    initPool();
                    showNextRandom();
                });
            }
            requestAnimationFrame(() => {
                letterCard.classList.add('is-visible');
            });
        }

        function showNextRandom() {
            if (remainingIndices.length === 0) {
                showFinalMessage();
                return;
            }

            const r = Math.floor(Math.random() * remainingIndices.length);
            const arrayIndex = remainingIndices.splice(r, 1)[0];
            shownCount += 1;
            showPoemByIndex(arrayIndex, shownCount);
        }

        nextLetterButton.addEventListener('click', () => {
            showNextRandom();
        });

        // inicializar y mostrar la primera carta aleatoria
        initPool();
        showNextRandom();
    </script>
